<title>QC V6 Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky contents rail + one readable column; tables and code scroll inside their own boxes. */
:root {
  --ground: #F5F7F6; --surface: #FFFFFF; --surface-2: #EEF2F1; --line: #D8E0DE;
  --ink: #14212B; --ink-2: #4A5A63; --ink-3: #76858C; --measure: #0B7A75; --measure-soft: #DDF1EF; --marker: #D99A1E;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0F1519; --surface: #151D22; --surface-2: #1B252B; --line: #28343B;
  --ink: #E6EDEF; --ink-2: #A6B4BA; --ink-3: #7A8A91; --measure: #3CC4BB; --measure-soft: #123634; --marker: #F0B840; color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground: #0F1519; --surface: #151D22; --surface-2: #1B252B; --line: #28343B;
  --ink: #E6EDEF; --ink-2: #A6B4BA; --ink-3: #7A8A91; --measure: #3CC4BB; --measure-soft: #123634; --marker: #F0B840; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 15px/1.6 var(--body); margin: 0; }
.wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; max-height: calc(100vh - 48px); overflow: auto; font-size: 13px; }
nav.toc .brand { font: 600 18px/1.2 var(--display); margin-bottom: 4px; }
nav.toc .sub { color: var(--ink-3); font-size: 12px; margin-bottom: 18px; }
nav.toc a { display: block; color: var(--ink-2); text-decoration: none; padding: 4px 10px; border-left: 2px solid var(--line); }
nav.toc a:hover { color: var(--ink); }
nav.toc a.on { color: var(--measure); border-left-color: var(--measure); background: var(--measure-soft); }
nav.toc a:focus-visible, a:focus-visible { outline: 2px solid var(--measure); outline-offset: 2px; }
article { min-width: 0; max-width: 860px; }
article h1 { font: 600 34px/1.15 var(--display); letter-spacing: -0.01em; margin: 0 0 18px; text-wrap: balance; }
article h2 { font: 600 24px/1.25 var(--display); margin: 52px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); text-wrap: balance; }
article h3 { font: 600 18px/1.3 var(--display); margin: 32px 0 8px; }
article p, article li { max-width: 72ch; }
article a { color: var(--measure); }
article hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
article strong { font-weight: 600; }
article code { font: 13px var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
article pre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; overflow-x: auto; font: 12.5px/1.55 var(--mono); }
article pre code { background: none; padding: 0; font-size: inherit; }
.tbl { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
article table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
article th { text-align: left; font-weight: 600; color: var(--ink-2); background: var(--surface-2); }
article th, article td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
article tr:last-child td { border-bottom: 0; }
article td { font-variant-numeric: tabular-nums; }
.status { color: var(--ink-3); font-size: 13px; }
.load-error { border: 1px solid var(--marker); padding: 12px 16px; border-radius: 10px; }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; } nav.toc { position: static; max-height: none; }
  nav.toc .links { display: none; } article h1 { font-size: 28px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

<div class="wrap">
  <nav class="toc" aria-label="Contents">
    <div class="brand">QC V6</div>
    <div class="sub">Architecture blueprint · for the dev lead</div>
    <div class="links" id="toc"></div>
  </nav>
  <article id="doc"><p class="status">Loading the blueprint…</p></article>
</div>

<script>
(async function () {
  const doc = document.getElementById("doc");
  const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  try {
    const res = await fetch("ARCHITECTURE.md");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const md = await res.text();
    const html = window.marked ? marked.parse(md, { gfm: true }) : "<pre>" + md.replace(/[<&]/g, (c) => ({ "<": "&lt;", "&": "&amp;" }[c])) + "</pre>";
    doc.innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : html;
  } catch (e) {
    doc.innerHTML = '<div class="load-error">The blueprint text could not be loaded (' + String(e.message || e) +
      '). It is also in the repository at docs/blueprint/ARCHITECTURE.md.</div>';
    return;
  }
  doc.querySelectorAll("table").forEach((t) => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
  doc.querySelectorAll("a[href$='.md']").forEach((a) => { a.removeAttribute("href"); a.title = "In the repository: docs/blueprint/"; });
  const toc = document.getElementById("toc");
  const heads = [...doc.querySelectorAll("h2")];
  heads.forEach((h) => {
    h.id = slug(h.textContent);
    const a = document.createElement("a");
    a.href = "#" + h.id; a.textContent = h.textContent;
    toc.appendChild(a);
  });
  const links = [...toc.querySelectorAll("a")];
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) links.forEach((l) => l.classList.toggle("on", l.getAttribute("href") === "#" + en.target.id)); });
  }, { rootMargin: "0px 0px -70% 0px" });
  heads.forEach((h) => io.observe(h));
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
